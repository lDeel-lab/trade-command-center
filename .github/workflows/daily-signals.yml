name: Daily market briefing

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily = 07:00 UK in summer (crypto-only at weekends)
  workflow_dispatch: {}    # "Run workflow" button for instant testing

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compute dashboard URL
        run: |
          if [ -n "${{ vars.DASHBOARD_URL }}" ]; then
            echo "DASHBOARD_URL=${{ vars.DASHBOARD_URL }}" >> "$GITHUB_ENV"
          else
            echo "DASHBOARD_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi
      - name: Build briefing, post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signals.py
