name: Dashboard data refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["state/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore daily fundamentals cache
        uses: actions/cache@v4
        with:
          path: site/data/fundamentals.json
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-
      - name: Build fundamentals (only if missing or stale >20h)
        run: |
          python - <<'EOF'
          import json, os, subprocess, time
          p = "site/data/fundamentals.json"
          stale = True
          if os.path.exists(p):
              try:
                  gen = json.load(open(p)).get("generated", 0)
                  stale = (time.time()*1000 - gen) > 20*3600*1000
              except Exception:
                  pass
          if stale:
              subprocess.run(["python", "build_fundamentals.py"], check=True)
          else:
              print("fundamentals fresh — skipping")
          EOF
      - name: Build market data
        run: python build_markets.py
      - name: Build tagged news
        run: python build_news.py
      - name: Trade journal + signal alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node journal.js || echo "journal step failed — site still deploys"
      - name: Commit journal state
        run: |
          git config user.name "journal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/journal.json || true
          git diff --cached --quiet || git commit -m "journal: update [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push || true
      - name: Assemble site
        run: cp dashboard.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
